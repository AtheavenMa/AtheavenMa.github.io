name: Verify published OpenResearch Atlas structure
on:
  push:
    branches:
      - main
    paths:
      - "test/atlas_public_structure.cjs"
      - "opensae/openresearch/atlas/**"
      - ".github/workflows/check-atlas-public.yml"
  pull_request:
    branches:
      - main
    paths:
      - "test/atlas_public_structure.cjs"
      - "opensae/openresearch/atlas/**"
      - ".github/workflows/check-atlas-public.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate source identity, research branches and tree fanout
        run: node test/atlas_public_structure.cjs
