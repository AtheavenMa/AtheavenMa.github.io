name: Sync OpenResearch Atlas snapshot
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-openresearch-atlas.yml"

permissions:
  contents: write

concurrency:
  group: sync-openresearch-atlas
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch and verify source-backed Atlas snapshots
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import json
          import re
          from urllib.request import Request, urlopen

          dest = Path("opensae/openresearch/atlas")
          source = "https://raw.githubusercontent.com/OpenSAE/OpenResearch/"
          api = "https://api.github.com/repos/OpenSAE/OpenResearch/branches/main"
          def read(url):
              request = Request(url, headers={"User-Agent": "OpenResearch-Atlas-Snapshot-Sync"})
              with urlopen(request, timeout=45) as response:
                  return response.read()
          head = json.loads(read(api))["commit"]["sha"]
          prefix = source + head + "/harness/visualization/"
          raw_data = read(prefix + "data.js")
          raw_structure = read(prefix + "atlas-structure.js")
          def parse_js(data, name):
              body = data.decode("utf-8").split(name + " = ", 1)[1].strip()
              if not body.endswith(";"):
                  raise ValueError("Unsealed generated JSON expression")
              return json.loads(body[:-1])
          graphs = parse_js(raw_data, "window.OPENRESEARCH_ATLAS")
          patch = parse_js(raw_structure, "window.OPENRESEARCH_ATLAS_PATCH")
          assert patch["schema"] == "openresearch.atlas.structure.v1"
          assert patch["knowledge"] == graphs["knowledge"]
          assert set(graphs) == {"core", "knowledge", "code", "environment", "context"}
          for name, graph in graphs.items():
              nodes = {node["id"] for node in graph["nodes"]}
              assert len(nodes) == len(graph["nodes"]), (name, "duplicate IDs")
              hierarchy = {"contains", "refines", "addresses", "decomposes"} if name in {"core", "knowledge"} else {"contains"}
              fanout = Counter(edge["source"] for edge in graph["edges"] if edge["type"] in hierarchy)
              assert max(fanout.values(), default=0) <= 10, (name, fanout.most_common(3))
              assert all(e["source"] in nodes and e["target"] in nodes for e in graph["edges"]), name
          knowledge_ids = {node["id"] for node in graphs["knowledge"]["nodes"]}
          assert {"knowledge:area:cub", "knowledge:area:sae"} <= knowledge_ids
          for area in ("assets", "capture", "intervene", "generate", "circuits", "explain", "benchmark", "train"):
              assert "s.sae." + area in knowledge_ids, area
          assert any(n["id"].startswith("code:nav:") for n in graphs["code"]["nodes"])
          assert not any(re.search(r"(?i)\bwp\s*\d+\b", n["title"]) for n in graphs["code"]["nodes"])
          assert "opensae.wp12.nnsight_generation_edit.v1" not in raw_data.decode("utf-8")
          dest.mkdir(parents=True, exist_ok=True)
          (dest / "data.js").write_bytes(raw_data)
          (dest / "atlas-structure.js").write_bytes(raw_structure)
          print("Verified and copied Atlas snapshot from", head)
          print("Nodes:", {name: len(graph["nodes"]) for name, graph in graphs.items()})
          PY
      - name: Commit refreshed Atlas assets when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opensae/openresearch/atlas/data.js opensae/openresearch/atlas/atlas-structure.js
          if ! git diff --cached --quiet; then
            git commit -m "chore(atlas): sync verified OpenResearch source snapshot [skip ci]"
            git push origin HEAD:main
          else
            echo "Atlas snapshot is already in sync"
          fi
