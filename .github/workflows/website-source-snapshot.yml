name: Source snapshot for website refresh
on:
  push:
    branches: [prep/website-refresh-source-snapshot]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Package source for offline review
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from shutil import copy2
          names = [
            "_pages/about.md", "_pages/cv.md", "_pages/blog.md", "_pages/news.md",
            "assets/landing/js/data.js", "assets/landing/js/main-20260813-landing-4.js",
            "assets/landing/js/main.js", "assets/landing/css/style.css",
            "_bibliography/papers.bib", "_data/cv.yml", "_data/socials.yml",
            "_data/repositories.yml", "assets/json/resume.json", "_config.yml",
            "README.md", ".github/workflows/deploy.yml",
            ".github/workflows/render-cv.yml", "assets/img/haotian_profile.png",
            "Gemfile", "package.json",
          ]
          root = Path("source-snapshot")
          for name in names:
            src = Path(name)
            if src.is_file():
              dest = root / name
              dest.parent.mkdir(parents=True, exist_ok=True)
              copy2(src, dest)
              print(name)
          (root / "SNAPSHOT_COMMIT").write_text("137891feb18fe07d5abe04215b29dc40d8999d58\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: website-source-snapshot
          path: source-snapshot/
          retention-days: 2
          include-hidden-files: true
