<!doctype html>
<!-- 目的和主要功能：提供 ExtractStructure 文章、目录与文件结构图的页面骨架。
     适用范围：本技能的服务页面与独立页面；内部组件读取当前图资料，提供展开、收起和聚焦。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ExtractStructure</title>
<style>
/* 目的和主要功能：定义 Mineral Atlas 双主题色彩与 ExtractStructure 页框布局。
 * 适用范围：本 Skill 的目录图和文件图页面；组件按颜色用途读取主题变量。
 */
:root{
  --atlas-font-sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --atlas-font-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
  --atlas-type-product:600 18px/1.5 var(--atlas-font-sans);
  --atlas-type-path:600 16px/1.5 var(--atlas-font-sans);
  --atlas-type-group:600 13px/1.5 var(--atlas-font-sans);
  --atlas-type-filename:500 13px/1.5 var(--atlas-font-mono);
  --atlas-type-description:400 12px/1.5 var(--atlas-font-sans);
  --atlas-type-caption:500 12px/1.5 var(--atlas-font-sans);
  --atlas-type-toolbar:500 13px/1.5 var(--atlas-font-sans);
}
:root,[data-theme="light"]{
  color-scheme:light;
  --atlas-independent:#808987;
  --atlas-category-opacity:.14;--atlas-category-hover-opacity:.20;--atlas-category-selected-opacity:.26;
  --atlas-canvas:#FFFFFF;--atlas-chrome:#FFFFFF;--atlas-group:#E8EAE3;
  --atlas-node:#F4F3EC;--atlas-node-hover:#F6FAF7;--atlas-node-selected:#E9F5F0;
  --atlas-group-border:#CDD5CE;--atlas-node-border:#B7C8BF;
  --atlas-text:#202B2B;--atlas-text-secondary:#4B625B;--atlas-text-muted:#586D65;
  --atlas-edge:#627C72;--atlas-edge-dimmed:#9CAC9F;
  --atlas-accent:#187A69;--atlas-accent-hover:#126557;--atlas-copper:#AF754D;--atlas-overview:#235345;
  --atlas-operation:#187A69;--atlas-data:#4D6D7A;--atlas-result:#547C31;--atlas-rejection:#A75237;
  --atlas-shadow:0 1px 3px #202B2B0A;--atlas-node-filter:drop-shadow(0 1px 2px #202B2B0A);
}
[data-theme="dark"]{
  color-scheme:dark;
  --atlas-independent:#A0AAA6;
  --atlas-category-opacity:.18;--atlas-category-hover-opacity:.24;--atlas-category-selected-opacity:.30;
  --atlas-canvas:#11191A;--atlas-chrome:#162020;--atlas-group:#1C2929;
  --atlas-node:#2B3938;--atlas-node-hover:#334541;--atlas-node-selected:#24413A;
  --atlas-group-border:#425751;--atlas-node-border:#526A64;
  --atlas-text:#E9EEE6;--atlas-text-secondary:#B8C6C0;--atlas-text-muted:#9EAEA9;
  --atlas-edge:#809B95;--atlas-edge-dimmed:#5B746E;
  --atlas-accent:#79D2B6;--atlas-accent-hover:#A3E4D0;--atlas-copper:#D8AB73;--atlas-overview:#548C76;
  --atlas-operation:#79D2B6;--atlas-data:#A5BAC5;--atlas-result:#A9D17B;--atlas-rejection:#E3A07E;
  --atlas-shadow:none;--atlas-node-filter:none;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--atlas-canvas);color:var(--atlas-text)}
code,pre,kbd,samp{font-family:var(--atlas-font-mono)}
body{font:14px/1.5 var(--atlas-font-sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,a{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--atlas-accent);outline-offset:3px}
.app{height:100dvh;min-height:380px;display:flex;flex-direction:column;overflow:hidden;background:var(--atlas-canvas)}
.topbar{display:flex;align-items:center;gap:20px;flex:none;height:65px;min-height:65px;padding:0 25px;background:var(--atlas-chrome);border-bottom:1px solid var(--atlas-group-border)}
.brand{display:inline-flex;align-items:center;gap:9px;flex:none;white-space:nowrap;font:var(--atlas-type-product);letter-spacing:-.45px;color:var(--atlas-text)}
.brand-mark{font-size:19px;font-weight:500;color:var(--atlas-accent)}
.workspace{display:flex;flex-direction:column;flex:1;min-height:0;min-width:0}
.toolbar{font:var(--atlas-type-toolbar);height:55px;flex:none;display:flex;align-items:center;padding:7px 22px;gap:12px;background:var(--atlas-chrome);border-bottom:1px solid var(--atlas-group-border)}
.tool-actions{display:flex;align-items:center;gap:4px;width:100%;min-width:0;flex-shrink:0}
.search-box{display:flex;align-items:center;width:205px;height:34px;border:1px solid var(--atlas-node-border);border-radius:8px;padding:0 9px;background:var(--atlas-node);color:var(--atlas-text-muted);margin-right:auto}
.search-box:focus-within{border-color:var(--atlas-accent)}
.search-symbol{font-size:20px;line-height:1;margin-right:5px}
.search-box input{min-width:0;width:100%;border:0;background:none;outline:0;font:var(--atlas-type-toolbar);color:var(--atlas-text)}
.search-box input::placeholder{color:var(--atlas-text-muted)}
.search-box input::-webkit-search-cancel-button{cursor:pointer}
.icon-button{height:32px;min-width:32px;border:1px solid transparent;border-radius:6px;background:none;padding:5px 8px;color:var(--atlas-text-secondary);font:var(--atlas-type-toolbar)}
.icon-button:hover:not(:disabled){background:var(--atlas-node-hover);color:var(--atlas-text)}
button:disabled{cursor:default;color:var(--atlas-text-muted)}
.tool-actions select{height:32px;max-width:135px;padding:0 8px;border:1px solid var(--atlas-node-border);border-radius:7px;background:var(--atlas-node);color:var(--atlas-text-secondary);font:var(--atlas-type-toolbar)}
.toolbar-separator{width:1px;height:19px;background:var(--atlas-group-border);margin:0 6px}
.zoom-value{min-width:42px;text-align:center;color:var(--atlas-text-muted);font:var(--atlas-type-toolbar);font-variant-numeric:tabular-nums}
.visual-stage{position:relative;display:flex;flex:1;min-height:0;min-width:0;overflow:hidden}
.graph-panel{display:flex;flex-direction:column;position:relative;min-height:0;min-width:0;flex:1;overflow:hidden}
.canvas-wrap,.canvas-wrap.in-focus{display:block;position:relative;flex:1;min-height:180px;min-width:0;overflow:hidden;outline:none;background:var(--atlas-canvas);background-image:none;overscroll-behavior:contain;cursor:grab;touch-action:none;scrollbar-color:var(--atlas-node-border) var(--atlas-canvas)}
.canvas-wrap.is-dragging{cursor:grabbing;user-select:none}
#canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#canvas>svg#diagram{position:static;width:100%;height:100%;max-width:none;max-height:none;margin:0;user-select:none;will-change:auto;transform:none}
.canvas-foot{height:39px;min-height:39px;flex:none;padding:9px 22px;border-top:1px solid var(--atlas-group-border);background:var(--atlas-chrome);display:flex;justify-content:space-between;gap:14px;align-items:center;font-size:11px;color:var(--atlas-text-muted)}
.canvas-foot>span:first-child{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.canvas-foot #sceneStatus{font-size:14px}.canvas-foot #sceneStatus.selection-active{color:var(--atlas-accent)}
.canvas-foot .interaction-hint{font-size:12.5px;white-space:nowrap;color:var(--atlas-text-muted)}
[hidden]{display:none!important}
@media(max-width:1120px){.topbar{padding:0 16px;gap:16px}.search-box{width:150px}.interaction-hint{display:none}.tool-actions{gap:1px}.tool-actions select{max-width:105px}}
@media(max-width:730px){.topbar{height:62px;min-height:62px;padding:10px 12px;gap:12px}.brand{font:var(--atlas-type-product)}.toolbar{font:var(--atlas-type-toolbar);height:auto;min-height:48px;padding:7px 10px;gap:6px}.tool-actions{flex-wrap:wrap;gap:3px}.search-box{width:145px}.tool-actions select{max-width:90px}.icon-button{min-width:24px;padding:4px 6px}.toolbar-separator{display:none}.canvas-foot{font-size:10px;padding:7px 10px}.canvas-foot #sceneStatus{font-size:13px}}


</style>
<style>
/* 目的和主要功能：将 Mineral Atlas 色彩角色应用于节点、分组、关系与交互状态。
 * 适用范围：本 Skill 的目录图和文件图画布；主题切换沿用相同布局及语义。
 */
.status-legend{position:absolute;z-index:3;display:flex;align-items:center;pointer-events:none;border:1px solid var(--atlas-group-border);border-radius:9px;bottom:18px;right:20px;padding:11px 14px;gap:18px;background:var(--atlas-chrome)}
.legend-item{display:flex;align-items:center;gap:8px;white-space:nowrap;color:var(--atlas-text-secondary);font-size:12px}
.legend-swatch{display:block;width:18px;height:18px;border-radius:4px;flex:none}
.legend-swatch.overview{background:var(--atlas-overview)}
.legend-swatch.operation{background:var(--atlas-operation)}.legend-swatch.object{background:var(--atlas-data)}.legend-swatch.result{background:var(--atlas-result)}.legend-swatch.failure{background:var(--atlas-rejection)}
.node{outline:none}.node text{pointer-events:none}
#diagram .graph-node .node-surface{fill:var(--atlas-node);stroke:var(--atlas-node-border);stroke-width:1.1;filter:var(--atlas-node-filter);transition:none}
#diagram .graph-node.upper .node-surface{stroke:var(--atlas-overview)}
#diagram .graph-node[class*="category-"] .node-surface{stroke:var(--node-category-color)}
#diagram .graph-node:hover .node-surface{fill:var(--node-category-color,var(--atlas-node-hover));stroke:var(--node-category-color,var(--atlas-accent));stroke-width:1.5}
#diagram .graph-node.selected .node-surface{fill:var(--node-category-color,var(--atlas-node-selected));stroke:var(--node-category-color,var(--atlas-accent));stroke-width:1.9}
#diagram .graph-node:focus-visible .node-surface{stroke:var(--node-category-color,var(--atlas-accent));stroke-width:2.5}
#diagram .graph-node:focus-visible{outline:2px solid var(--node-category-color,var(--atlas-accent));outline-offset:5px;border-radius:10px}
#diagram .graph-node .node-title{fill:var(--atlas-text);font:var(--atlas-type-description)}
#diagram .graph-node .node-filename{font:var(--atlas-type-filename);fill:var(--atlas-text)}
.node .node-status{stroke:none}.node.lower{cursor:pointer}
#diagram .graph-node .node-entry-link{cursor:pointer;outline:none}
#diagram .graph-node .node-entry-link text{pointer-events:auto;text-decoration:underline;text-decoration-thickness:.7px;text-underline-offset:3px}
#diagram .graph-node .node-entry-link:hover text,#diagram .graph-node .node-entry-link:focus-visible text{fill:var(--node-category-color,var(--atlas-accent))}
#diagram .graph-node .child-count rect{fill:var(--atlas-group);stroke:var(--atlas-node-border);stroke-width:.7}
#diagram .graph-node .child-count text{fill:var(--atlas-text-secondary);font-size:11px}
.guides{display:none}
.edge{cursor:pointer}.edge>.edge-line,.edge>.edge-hit,.edge>.arrow-end,.edge>.arrow-start{display:none!important}
.wire-segment{cursor:pointer;outline:none}.wire-line{stroke:var(--atlas-edge);stroke-width:1.5;pointer-events:none}
.wire-segment.main .wire-line{stroke-width:1.65}.wire-segment.shared .wire-line{stroke-width:2.2}
.wire-segment.related-hover .wire-line{stroke:var(--atlas-accent-hover);stroke-width:2}
.wire-segment:hover .wire-line,.wire-segment:focus-visible .wire-line{stroke:var(--atlas-accent-hover);stroke-width:2.5}
.wire-segment.selected .wire-line{stroke:var(--atlas-accent);stroke-width:2.8}
.wire-segment.dim .wire-line{stroke:var(--atlas-edge-dimmed)}
.wire-hit{pointer-events:stroke}.wire-junction{fill:var(--atlas-edge)}
.node.dim{opacity:.65}.wire-segment.dim{opacity:.8}.inline-caption.dim{opacity:.8}
.owner-control{cursor:pointer;outline:none}.owner-control text{pointer-events:none}
.range-fill{fill:var(--atlas-canvas);fill-opacity:1;pointer-events:none}
.range-outline{fill:none;stroke:var(--concept-color,var(--atlas-overview));stroke-width:1.2;pointer-events:none}
.range-border-hit{fill:none;stroke:transparent;stroke-width:12;pointer-events:stroke;cursor:pointer;outline:none}
.concept-focused .range-outline,.range-border-hit:focus-visible{stroke:var(--concept-color,var(--atlas-accent));stroke-width:1.8}
.concept-title rect{fill:none;stroke:none;pointer-events:all}
.concept-title text{font:var(--atlas-type-group);fill:var(--atlas-text-secondary)}
.concept-title .concept-disclosure{font-size:20px}
.concept-title:hover text,.concept-title:focus-visible text,.concept-title.concept-focused text{fill:var(--concept-color,var(--atlas-accent))}
.concept-title:focus-visible rect{stroke:var(--concept-color,var(--atlas-accent));stroke-width:1.5}
.node.concept-member .node-surface{stroke:var(--node-category-color,var(--atlas-accent));stroke-width:1.5}
#diagram .graph-node[class*="category-"] .node-surface{fill:var(--node-category-color);fill-opacity:var(--atlas-category-opacity)}
#diagram .graph-node[class*="category-"]:hover .node-surface{fill-opacity:var(--atlas-category-hover-opacity)}
#diagram .graph-node[class*="category-"].selected .node-surface{fill-opacity:var(--atlas-category-selected-opacity)}
#diagram .graph-node[class*="category-"]:focus-visible .node-surface{fill-opacity:var(--atlas-category-selected-opacity)}
#diagram .graph-node[class*="category-"] .child-count rect{fill:var(--node-category-color);fill-opacity:var(--atlas-category-opacity);stroke:var(--node-category-color)}

.inline-caption{cursor:pointer;outline:none}
.inline-caption text{fill:var(--atlas-text-secondary);font:var(--atlas-type-caption);stroke:none}
.inline-caption.selected text,.inline-caption:hover text,.inline-caption:focus-visible text{fill:var(--atlas-accent)}
.caption-hitbox{fill:none;stroke:none;pointer-events:all}
.caption-leader{stroke:var(--atlas-edge);stroke-width:1;pointer-events:stroke}.caption-anchor{fill:var(--atlas-edge);pointer-events:none}
.inline-caption.selected .caption-leader,.inline-caption:hover .caption-leader,.inline-caption:focus-visible .caption-leader{stroke:var(--atlas-accent);stroke-width:1.6}
.graph-pathbar{display:flex;align-items:center;gap:4px;flex:1;min-width:0;padding:0;overflow-x:auto;white-space:nowrap;scrollbar-width:thin;color:var(--atlas-accent)}
.graph-breadcrumbs{display:flex;gap:5px;align-items:center;flex:none;font:var(--atlas-type-path);color:inherit}
.graph-pathbar a{color:inherit;text-decoration:none}.graph-pathbar a:hover{text-decoration:underline}
.path-divider{color:inherit;opacity:.65}
.graph-breadcrumbs .path-segment,.graph-breadcrumbs .path-choice{appearance:none;flex:none;background:transparent;border:0;border-radius:4px;color:inherit;font:inherit;cursor:pointer;white-space:nowrap}
.graph-breadcrumbs .path-segment{padding:5px 3px;max-width:260px}.graph-breadcrumbs .path-choice{line-height:26px;padding:0 3px}
.path-choice:hover,.path-choice:focus-visible,.path-next:hover,.path-next:focus-within{background:var(--atlas-node-hover);color:var(--atlas-text)}
.path-segment option,.graph-pathbar #graphPicker option{background:var(--atlas-node);color:var(--atlas-text)}
.path-next{position:relative;display:inline-flex;align-items:center;justify-content:center;width:22px;height:26px;color:var(--atlas-text-secondary);border-radius:4px}
.path-next svg{position:absolute;pointer-events:none;z-index:1}
.graph-pathbar .path-next #graphPicker{appearance:none;display:block;margin:0;width:22px;min-width:22px;max-width:22px;height:26px;padding:0;border:0;background:transparent;color:transparent;cursor:pointer}
.path-next .path-choice-next{position:absolute;inset:0;width:22px;height:26px;padding:0}
.file-suffix{color:inherit}
.path-menu{position:fixed;z-index:1000;min-width:180px;max-width:min(420px,calc(100vw - 16px));max-height:min(360px,calc(100vh - 24px));overflow:auto;padding:5px;background:var(--atlas-node);border:1px solid var(--atlas-node-border);border-radius:7px;box-shadow:var(--atlas-shadow);font:var(--atlas-type-toolbar)}
.path-menu button{display:block;width:100%;text-align:left;border:0;border-radius:3px;background:transparent;color:var(--atlas-text-secondary);padding:7px 10px;cursor:pointer;font:inherit;white-space:nowrap}
.path-menu button:hover,.path-menu button:focus-visible{background:var(--atlas-node-hover);color:var(--atlas-text)}
.path-menu button.current{background:var(--atlas-node-selected);color:var(--atlas-accent)}
.path-menu[hidden],.graph-breadcrumbs select[hidden],.path-next select[hidden]{display:none}
.language-switch,.theme-switch{display:flex;align-items:center;gap:5px;flex:none;font:var(--atlas-type-toolbar);color:var(--atlas-text-muted)}
.topbar .language-switch{margin-left:auto}
.language-switch button,.theme-switch button{background:transparent;border:0;padding:4px 2px;color:var(--atlas-text-secondary);cursor:pointer}
.language-switch button.active,.theme-switch button.active{color:var(--atlas-accent)}
.language-switch button:hover,.theme-switch button:hover{color:var(--atlas-accent-hover)}
.language-notice{font:11px var(--atlas-font-sans);color:var(--atlas-copper);max-width:420px}
.graph-empty-message{margin:60px auto;padding:24px;max-width:560px;color:var(--atlas-text-secondary);font:14px/1.8 var(--atlas-font-sans);text-align:center}
@media(max-width:730px){.language-switch,.theme-switch{gap:3px}.graph-pathbar{padding:0}.status-legend{right:10px;bottom:12px;padding:8px 10px;gap:12px}.legend-item{font-size:11px}.legend-swatch{height:16px;width:16px}}

/* 节点名称与解释在悬停或键盘聚焦时完整显示。 */
.node-explanation{position:fixed;z-index:1000;max-width:min(420px,calc(100vw - 16px));max-height:calc(100vh - 16px);overflow:auto;padding:12px 16px;border:1px solid var(--atlas-edge);border-radius:8px;background:var(--atlas-canvas,#fff);color:var(--atlas-text);font:13px/1.6 var(--atlas-font-sans);white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 4px 20px #0002;}
.node-explanation[hidden]{display:none}.node-explanation strong{display:block;margin-bottom:4px;}

</style></head>
<body><div class="app">
<header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">◈</span>ExtractStructure</div><nav class="graph-pathbar" aria-label="源码目录与文件"><div id="graphBreadcrumbs" class="graph-breadcrumbs"></div><span id="pathNext" class="path-next"><select id="graphPicker" aria-label="选择下一级目录或文件"></select><svg width="10" height="6" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span id="languageNotice" class="language-notice" hidden></span></nav><div class="language-switch" aria-label="Language"><button type="button" data-language="en">English</button><span aria-hidden="true">|</span><button type="button" data-language="zh">中文</button></div><div class="theme-switch" aria-label="Theme"><button type="button" data-theme="light">Light</button><span aria-hidden="true">|</span><button type="button" data-theme="dark">Dark</button></div></header>

ndings", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [10, 10], "section": "7 Conclusion"}]}, {"from": "L1_MOTIVE", "to": "L1_CONTRIBUTIONS", "label": "Summarize attention architecture", "description": "Summarize attention architecture", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [2, 10], "section": "1 Introduction; 7 Conclusion"}]}]}, "L2": {"name": "Article details", "explanation": "Explain the Transformer architecture, training choices and sequence-transduction evidence", "nodes": [{"id": "L2_SEQUENTIAL", "name": "Recurrence limits parallel training", "meaning": "Recurrent models compute each hidden state from the previous one, making training within a sequence inherently sequential, especially costly for long inputs.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [2, 2], "section": "1 Introduction"}], "category": "input"}, {"id": "L2_PREVIOUS", "name": "Attention and convolution precedents", "meaning": "Earlier attention handles distant dependencies alongside recurrent networks; convolutional approaches parallelize positions but require longer paths to connect distant tokens.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [2, 2], "section": "1 Introduction; 2 Background"}], "category": "input"}, {"id": "L2_PROPOSAL", "name": "Use attention throughout", "meaning": "The Transformer forms encoder and decoder representations with self-attention and positionwise feed-forward networks, enabling parallel computation during training.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [2, 2], "section": "2 Background"}], "category": "output"}, {"id": "L2_ENCODER", "name": "Six encoder layers, width 512", "meaning": "Each of six encoder layers applies multi-head self-attention and a positionwise feed-forward network. All sublayers and embeddings use model width 512.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [3, 3], "section": "3.1 Encoder and decoder stacks"}], "category": "input"}, {"id": "L2_DECODER", "name": "Six decoder layers with source access", "meaning": "Each decoder layer has masked self-attention, encoder-decoder attention and a feed-forward network. Shift target inputs by one position so predictions use earlier known outputs.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [3, 3], "section": "3.1 Encoder and decoder stacks"}], "category": "process"}, {"id": "L2_RESIDUAL", "name": "Add residual, then normalize", "meaning": "Each sublayer computes LayerNorm(x + Sublayer(x)). Consistent model width allows residual addition across attention and feed-forward sublayers.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [3, 3], "section": "3.1 Encoder and decoder stacks"}], "category": "output"}, {"id": "L2_QKV", "name": "Queries, keys and values", "meaning": "A query assigns weights to key-value pairs; the attention output is the corresponding weighted sum of value vectors. Queries and keys have width d_k.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [3, 4], "section": "3.2 Attention"}], "category": "input"}, {"id": "L2_FORMULA", "name": "Softmax of scaled query-key scores", "meaning": "Compute Attention(Q,K,V)=softmax(QKᵀ/√d_k)V using matrix multiplication for many queries together.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [4, 4], "section": "3.2.1 Scaled dot-product attention", "label": "Equation 1"}], "category": "output"}, {"id": "L2_SCALE", "name": "Control large dot products", "meaning": "With independent query and key components of zero mean and unit variance, a dot product has variance d_k. Scaling by 1/√d_k counteracts growth that can push softmax into small-gradient regions.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [4, 4], "section": "3.2.1 Scaled dot-product attention", "label": "Footnote 4"}], "category": "process"}, {"id": "L2_PROJECT", "name": "Project each head independently", "meaning": "Use distinct learned query, key and value projections for each head, allowing attention to different positions and representation subspaces.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [4, 5], "section": "3.2.2 Multi-head attention"}], "category": "input"}, {"id": "L2_EIGHT", "name": "Eight heads of width 64", "meaning": "The base model uses eight heads with key and value widths 64, so total computation is similar to one full-width head.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [5, 5], "section": "3.2.2 Multi-head attention"}], "category": "process"}, {"id": "L2_CONCAT", "name": "Concatenate and project heads", "meaning": "Compute attention in parallel, concatenate head outputs and apply a learned output projection to recover model width.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [5, 5], "section": "3.2.2 Multi-head attention"}], "category": "output"}, {"id": "L2_ENCSELF", "name": "Encoder reads all source positions", "meaning": "Encoder queries, keys and values come from the previous encoder layer; every source position can attend to all source positions.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [5, 5], "section": "3.2.3 Applications of attention"}], "category": "input"}, {"id": "L2_MASK", "name": "Decoder masks future positions", "meaning": "Decoder self-attention reads its own preceding layer; set forbidden future scores to negative infinity before softmax to preserve autoregressive generation.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [5, 5], "section": "3.2.3 Applications of attention"}], "category": "process"}, {"id": "L2_CROSS", "name": "Decoder queries encoder memory", "meaning": "Encoder-decoder attention takes queries from the decoder and keys and values from final encoder output, giving each output position access to all source positions.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [5, 5], "section": "3.2.3 Applications of attention"}], "category": "output"}, {"id": "L2_TOKEN", "name": "Share embedding and output weights", "meaning": "Use learned token embeddings scaled by √d_model. Share a weight matrix across source embeddings, target embeddings and the pre-softmax output projection.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [5, 5], "section": "3.4 Embeddings and softmax"}], "category": "input"}, {"id": "L2_SINUSOID", "name": "Add sinusoidal positions", "meaning": "For position p and paired dimension i, use sin(p/10000^(2i/d_model)) and cos(p/10000^(2i/d_model)); add these vectors to embeddings at both stack inputs.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [6, 6], "section": "3.5 Positional encoding"}], "category": "process"}, {"id": "L2_RELATIVE", "name": "Represent fixed position offsets", "meaning": "For any fixed offset, shifted sinusoidal encodings can be represented as linear functions of the original encodings. The authors motivate relative-position learning and possible longer-length extrapolation with this property.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [6, 6], "section": "3.5 Positional encoding"}], "category": "output"}, {"id": "L2_FFN", "name": "Expand 512 to 2048, then return", "meaning": "Compute max(0,xW₁+b₁)W₂+b₂, with model width 512 and inner width 2048. The intermediate activation is rectified linear.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [5, 5], "section": "3.3 Position-wise feed-forward networks", "label": "Equation 2"}], "category": "input"}, {"id": "L2_POSITIONWISE", "name": "Share within a layer across positions", "meaning": "Apply the same feed-forward parameters independently to each position; different layers have their own parameters.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [5, 5], "section": "3.3 Position-wise feed-forward networks"}], "category": "output"}, {"id": "L2_PARALLEL", "name": "Constant sequential depth per layer", "meaning": "Full self-attention has per-layer complexity O(n²d), constant sequential operations and constant maximum path length. Recurrence has O(nd²) work and O(n) sequential steps and paths.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [6, 6], "section": "4 Why self-attention", "label": "Table 1"}], "category": "output"}, {"id": "L2_CONDITION", "name": "Cost comparison depends on n and d", "meaning": "The stated self-attention-versus-recurrence cost advantage applies when sequence length n is smaller than representation width d. Restricted neighborhoods of size r trade O(rnd) work for O(n/r) paths.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [6, 7], "section": "4 Why self-attention"}], "category": "process"}, {"id": "L2_CONVPATH", "name": "Convolution needs longer paths", "meaning": "Connecting distant positions with contiguous convolutions requires O(n/k) layers; dilated convolutions require O(log_k n), compared with direct full attention connections.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [7, 7], "section": "4 Why self-attention"}], "category": "output"}, {"id": "L2_DATA", "name": "4.5 million and 36 million pairs", "meaning": "Use WMT 2014 English-German with about 4.5 million pairs and a shared vocabulary near 37000; English-French uses 36 million sentences and a 32000-piece vocabulary.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [7, 7], "section": "5.1 Training data and batching"}], "category": "input"}, {"id": "L2_BATCH", "name": "Group similar lengths into batches", "meaning": "Each batch contains approximately 25000 source and 25000 target tokens, with sentence pairs grouped by approximate sequence length.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [7, 7], "section": "5.1 Training data and batching"}], "category": "process"}, {"id": "L2_SCHEDULE", "name": "Warm up for 4000 steps", "meaning": "Use Adam with β₁=0.9, β₂=0.98 and ε=10⁻⁹. Learning rate equals d_model^−0.5 times min(step^−0.5, step·4000^−1.5), increasing linearly before inverse-square-root decay.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [7, 7], "section": "5.3 Optimizer", "label": "Equation 3"}], "category": "output"}, {"id": "L2_HARDWARE", "name": "Eight P100s; 12 hours or 3.5 days", "meaning": "Train the base model for 100000 steps, about 12 hours, at 0.4 seconds per step. Train the big model for 300000 steps, about 3.5 days, at 1.0 second per step, on eight P100 graphics processors.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [7, 7], "section": "5.2 Hardware and schedule"}], "category": "output"}, {"id": "L2_DROPOUT", "name": "Drop sublayer and embedding outputs", "meaning": "Apply dropout before residual addition and normalization, and to embedding-plus-position vectors. Base-model dropout is 0.1.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [8, 8], "section": "5.4 Regularization"}], "category": "process"}, {"id": "L2_SMOOTH", "name": "Smooth target labels by 0.1", "meaning": "Label smoothing with value 0.1 worsens perplexity in the reported comparison while improving prediction accuracy and translation score.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [8, 8], "section": "5.4 Regularization"}], "category": "output"}, {"id": "L2_BEAM", "name": "Average checkpoints; beam width 4", "meaning": "Average the last five base checkpoints or twenty big-model checkpoints. Translation uses beam width four, length penalty 0.6 and a maximum output length of input length plus fifty.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [8, 8], "section": "6.1 Machine translation"}], "category": "output"}, {"id": "L2_GERMAN", "name": "English–German reaches 28.4", "meaning": "Table 2 reports 28.4 for the big Transformer and 27.3 for the base model; the listed convolutional ensemble reaches 26.36. The paper reports an improvement above two points over previous best results.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [8, 8], "section": "6.1 Machine translation", "label": "Table 2"}], "category": "output"}, {"id": "L2_FRENCH", "name": "English–French: 41.8 in Table 2", "meaning": "The abstract and Table 2 report 41.8 for the big Transformer, while the Section 6.1 paragraph states 41.0. Table 2 lists 41.29 for the convolutional ensemble and 38.1 for the base Transformer.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [1, 8], "section": "Abstract; 6.1 Machine translation", "label": "Table 2"}], "category": "output"}, {"id": "L2_COST", "name": "Report training operation estimates", "meaning": "Table 2 lists 3.3×10¹⁸ floating-point operations for the base Transformer and 2.3×10¹⁹ for the big model. Costs are estimated from training time, processor count and sustained single-precision throughput.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [8, 8], "section": "6.1 Machine translation", "label": "Table 2"}], "category": "output"}, {"id": "L2_HEADTEST", "name": "One head loses 0.9 points", "meaning": "At comparable computation, the single-head development score is 24.9 versus 25.8 for the base model; too many heads also reduce quality. Smaller key widths hurt performance.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [9, 9], "section": "6.2 Model variations", "label": "Table 3"}], "category": "output"}, {"id": "L2_SIZETEST", "name": "Capacity and dropout matter", "meaning": "The experiments vary depth, model width, feed-forward width, dropout and label smoothing. The big setting uses width 1024, feed-forward width 4096 and sixteen heads.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [9, 9], "section": "6.2 Model variations", "label": "Table 3"}], "category": "output"}, {"id": "L2_POSTEST", "name": "Learned positions are comparable", "meaning": "Replacing sinusoids with learned position embeddings yields a development score of 25.7 versus 25.8 for the base sinusoidal setting.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [9, 9], "section": "6.2 Model variations", "label": "Table 3, row E"}], "category": "output"}, {"id": "L2_PARSESETUP", "name": "Train a four-layer parser", "meaning": "Use four layers and width 1024. Train on roughly 40000 Penn Treebank sentences, or add high-confidence parsed data for a roughly seventeen-million-sentence setting.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [9, 9], "section": "6.3 English constituency parsing"}], "category": "input"}, {"id": "L2_PARSEDECODE", "name": "Allow longer structured outputs", "meaning": "Parsing inference uses maximum output length input plus 300, beam width 21 and length penalty 0.3.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [10, 10], "section": "6.3 English constituency parsing"}], "category": "process"}, {"id": "L2_PARSERESULT", "name": "Parsing scores: 91.3 and 92.7", "meaning": "On Wall Street Journal Section 23, the Transformer achieves F1 91.3 using the standard training set and 92.7 with semi-supervised data. The table also lists stronger multi-task and generative comparisons at 93.0 and 93.3.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [10, 10], "section": "6.3 English constituency parsing", "label": "Table 4"}], "category": "output"}, {"id": "L2_C1", "name": "Contribution 1: attention architecture", "meaning": "A complete encoder-decoder sequence model builds representations using multi-head attention and positionwise transformations, supporting substantially more parallel training.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [2, 10], "section": "1 Introduction; 7 Conclusion"}], "category": "output"}, {"id": "L2_C2", "name": "Contribution 2: translation evidence", "meaning": "Translation comparisons support high quality at reduced training cost, and parsing experiments demonstrate transfer to another structured prediction task.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [10, 10], "section": "7 Conclusion"}], "category": "output"}, {"id": "L2_FUTURE", "name": "Explore restricted attention and modalities", "meaning": "The conclusion proposes restricted attention for larger inputs, applications beyond text and generation with fewer sequential steps as further research directions.", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [10, 10], "section": "7 Conclusion"}], "category": "output"}], "edges": [{"from": "L2_SEQUENTIAL", "to": "L2_PROPOSAL", "label": "Motivate parallel representations", "description": "Motivate parallel representations", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [2, 2], "section": "2 Background"}]}, {"from": "L2_PREVIOUS", "to": "L2_PROPOSAL", "label": "Supply architectural context", "description": "Supply architectural context", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [2, 2], "section": "2 Background"}]}, {"from": "L2_PROPOSAL", "to": "L2_ENCODER", "label": "Define the source stack", "description": "Define the source stack", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [3, 3], "section": "3.1 Encoder and decoder stacks"}]}, {"from": "L2_ENCODER", "to": "L2_DECODER", "label": "Supply source representations", "description": "Supply source representations", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [3, 3], "section": "3.1 Encoder and decoder stacks"}]}, {"from": "L2_ENCODER", "to": "L2_RESIDUAL", "label": "Require compatible widths", "description": "Require compatible widths", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [3, 3], "section": "3.1 Encoder and decoder stacks"}]}, {"from": "L2_QKV", "to": "L2_FORMULA", "label": "Supply attention inputs", "description": "Supply attention inputs", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [4, 4], "section": "3.2.1 Scaled dot-product attention", "label": "Equation 1"}]}, {"from": "L2_SCALE", "to": "L2_FORMULA", "label": "Set score scaling", "description": "Set score scaling", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [4, 4], "section": "3.2.1 Scaled dot-product attention", "label": "Equation 1"}]}, {"from": "L2_FORMULA", "to": "L2_PROJECT", "label": "Define each projected head", "description": "Define each projected head", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [4, 5], "section": "3.2.2 Multi-head attention"}]}, {"from": "L2_PROJECT", "to": "L2_EIGHT", "label": "Choose head dimensions", "description": "Choose head dimensions", "source": [{"path": "68f1160d-5b5b-4c73-94b4-e3783bd0a693/1706.03762v7.pdf", "pages": [5, 5], "section": "3.2.2 Multi-head attention"}]}, {"from": "L2_EIGHT", "to": "L2_CONCAT", "label": "Supply parallel outputs" ion"}, "L2_CONVPATH": {"column": 0, "lane": 0, "role": "operation"}, "L2_DATA": {"column": 0, "lane": 0, "role": "operation"}, "L2_BATCH": {"column": 0, "lane": 0, "role": "operation"}, "L2_SCHEDULE": {"column": 0, "lane": 0, "role": "operation"}, "L2_HARDWARE": {"column": 0, "lane": 0, "role": "operation"}, "L2_DROPOUT": {"column": 0, "lane": 0, "role": "operation"}, "L2_SMOOTH": {"column": 0, "lane": 0, "role": "operation"}, "L2_BEAM": {"column": 0, "lane": 0, "role": "operation"}, "L2_GERMAN": {"column": 0, "lane": 0, "role": "operation"}, "L2_FRENCH": {"column": 0, "lane": 0, "role": "operation"}, "L2_COST": {"column": 0, "lane": 0, "role": "operation"}, "L2_HEADTEST": {"column": 0, "lane": 0, "role": "operation"}, "L2_SIZETEST": {"column": 0, "lane": 0, "role": "operation"}, "L2_POSTEST": {"column": 0, "lane": 0, "role": "operation"}, "L2_PARSESETUP": {"column": 0, "lane": 0, "role": "operation"}, "L2_PARSEDECODE": {"column": 0, "lane": 0, "role": "operation"}, "L2_PARSERESULT": {"column": 0, "lane": 0, "role": "operation"}, "L2_C1": {"column": 0, "lane": 0, "role": "operation"}, "L2_C2": {"column": 0, "lane": 0, "role": "operation"}, "L2_FUTURE": {"column": 0, "lane": 0, "role": "operation"}}, "main_edges": []}}, "i18n": {"source_language": "en", "translations": {"zh": {"Explain the Transformer architecture, training choices and sequence-transduction evidence": "解释 Transformer 结构、训练选择和序列转换实验依据", "Main body on physical PDF pages 1–10, from abstract through Section 7 conclusion.": "PDF 第 1–10 页正文，从摘要到第七节结论。", "Parallel sequence transduction": "并行处理序列转换", "Replace position-by-position recurrence with attention-based representations for translation.": "用基于注意力的表示替代逐位置递归，服务机器翻译。", "Recurrence limits parallel training": "递归限制并行训练", "Recurrent models compute each hidden state from the previous one, making training within a sequence inherently sequential, especially costly for long inputs.": "递归模型依赖前一个隐藏状态计算当前状态，使同一序列内的训练依次进行，对长输入尤其昂贵。", "Attention and convolution precedents": "注意力与卷积研究基础", "Earlier attention handles distant dependencies alongside recurrent networks; convolutional approaches parallelize positions but require longer paths to connect distant tokens.": "已有注意力通常配合递归网络处理远距离依赖；卷积方法能够并行处理位置，但连接远处词元需要经过更多层。", "Use attention throughout": "全程使用注意力", "The Transformer forms encoder and decoder representations with self-attention and positionwise feed-forward networks, enabling parallel computation during training.": "Transformer 使用自注意力和逐位置前馈网络构建编码器、解码器表示，从而支持并行训练。", "Encoder and decoder stacks": "编码器与解码器堆叠", "Encode the source sequence and generate target tokens conditioned on encoded source and earlier outputs.": "编码来源序列，并根据来源表示和较早输出生成目标词元。", "Six encoder layers, width 512": "六层编码器，宽度 512", "Each of six encoder layers applies multi-head self-attention and a positionwise feed-forward network. All sublayers and embeddings use model width 512.": "六个编码器层各含多头自注意力和逐位置前馈网络；子层与嵌入均使用 512 的模型宽度。", "Six decoder layers with source access": "六层解码器读取来源表示", "Each decoder layer has masked self-attention, encoder-decoder attention and a feed-forward network. Shift target inputs by one position so predictions use earlier known outputs.": "解码器各层包含带掩码自注意力、编码器—解码器注意力和前馈网络；目标输入错开一个位置，使预测使用较早的已知输出。", "Add residual, then normalize": "相加残差后归一化", "Each sublayer computes LayerNorm(x + Sublayer(x)). Consistent model width allows residual addition across attention and feed-forward sublayers.": "每个子层计算 LayerNorm(x + Sublayer(x))；统一模型宽度使注意力和前馈子层都能进行残差相加。", "Scaled dot-product attention": "缩放点积注意力", "Compute query-key compatibility, normalize scores and combine value vectors.": "计算查询与键的匹配度，归一化分数后组合值向量。", "Queries, keys and values": "查询、键和值", "A query assigns weights to key-value pairs; the attention output is the corresponding weighted sum of value vectors. Queries and keys have width d_k.": "查询为各键值对分配权重，注意力输出是值向量的加权和；查询与键的宽度为 d_k。", "Softmax of scaled query-key scores": "归一化缩放后的查询键分数", "Compute Attention(Q,K,V)=softmax(QKᵀ/√d_k)V using matrix multiplication for many queries together.": "通过矩阵乘法同时处理多个查询，计算 Attention(Q,K,V)=softmax(QKᵀ/√d_k)V。", "Control large dot products": "控制较大的点积分数", "With independent query and key components of zero mean and unit variance, a dot product has variance d_k. Scaling by 1/√d_k counteracts growth that can push softmax into small-gradient regions.": "查询与键的分量独立、均值零、方差一时，点积方差为 d_k；乘以 1/√d_k 可抑制幅度增长，缓解概率归一化进入小梯度区域的情况。", "Attend in several subspaces": "在多个子空间中关注信息", "Learn separate projections and combine parallel attention heads.": "学习各自的投影，并组合并行注意力头。", "Project each head independently": "为各个头分别投影", "Use distinct learned query, key and value projections for each head, allowing attention to different positions and representation subspaces.": "每个头使用不同的可学习查询、键和值投影，从不同位置及表示子空间提取信息。", "Eight heads of width 64": "八个头，每头宽度 64", "The base model uses eight heads with key and value widths 64, so total computation is similar to one full-width head.": "基础模型使用八个头，键和值的宽度均为 64，总计算量与一个完整宽度的头接近。", "Concatenate and project heads": "拼接并投影各头输出", "Compute attention in parallel, concatenate head outputs and apply a learned output projection to recover model width.": "并行计算各头注意力，拼接输出并施加可学习输出投影，恢复模型宽度。", "Three attention information paths": "三种注意力信息路径", "Choose attention inputs and masking according to encoder, decoder and source-access roles.": "根据编码器、解码器和读取来源的职责，确定注意力输入与掩码。", "Encoder reads all source positions": "编码器读取全部来源位置", "Encoder queries, keys and values come from the previous encoder layer; every source position can attend to all source positions.": "编码器查询、键和值均来自前一编码器层，每个来源位置可关注全部来源位置。", "Decoder masks future positions": "解码器屏蔽未来位置", "Decoder self-attention reads its own preceding layer; set forbidden future scores to negative infinity before softmax to preserve autoregressive generation.": "解码器自注意力读取自身前一层；在概率归一化前将未来位置分数设为负无穷，以保持自回归生成。", "Decoder queries encoder memory": "解码器查询编码器表示", "Encoder-decoder attention takes queries from the decoder and keys and values from final encoder output, giving each output position access to all source positions.": "编码器—解码器注意力的查询来自解码器，键和值来自编码器最终输出，使每个输出位置可以读取全部来源位置。", "Token and position representations": "词元与位置表示", "Combine learned token identity, position signals and a shared vocabulary prediction matrix.": "结合可学习词元身份、位置信号和共享的词表预测矩阵。", "Share embedding and output weights": "共享嵌入与输出权重", "Use learned token embeddings scaled by √d_model. Share a weight matrix across source embeddings, target embeddings and the pre-softmax output projection.": "使用乘以 √d_model 的可学习词元嵌入；来源嵌入、目标嵌入和概率归一化前的输出投影共享权重矩阵。", "Add sinusoidal positions": "加入正弦与余弦位置编码", "For position p and paired dimension i, use sin(p/10000^(2i/d_model)) and cos(p/10000^(2i/d_model)); add these vectors to embeddings at both stack inputs.": "位置 p 和成对维度 i 分别使用 sin(p/10000^(2i/d_model)) 与 cos(p/10000^(2i/d_model))，在两种堆叠入口与词元嵌入相加。", "Represent fixed position offsets": "表示固定的位置偏移", "For any fixed offset, shifted sinusoidal encodings can be represented as linear functions of the original encodings. The authors motivate relative-position learning and possible longer-length extrapolation with this property.": "对固定偏移，偏移后正弦位置编码可表示为原编码的线性函数；作者据此讨论相对位置学习及更长序列外推的可能性。", "Transform each position identically": "对各位置执行相同变换", "Add a two-layer nonlinear transformation after attention.": "在注意力之后加入两层非线性变换。", "Expand 512 to 2048, then return": "从 512 扩到 2048 再返回", "Compute max(0,xW₁+b₁)W₂+b₂, with model width 512 and inner width 2048. The intermediate activation is rectified linear.": "计算 max(0,xW₁+b₁)W₂+b₂；模型宽度为 512，中间宽度为 2048，中间使用整流线性激活。", "Share within a layer across positions": "同层各位置共享参数", "Apply the same feed-forward parameters independently to each position; different layers have their own parameters.": "同一层各位置独立应用同一组前馈参数，不同层使用各自的参数。", "Why self-attention helps": "自注意力为何有用", "Compare computational work, sequential steps and long-range communication paths.": "比较计算量、顺序步骤以及远距离信息路径。", "Constant sequential depth per layer": "每层顺序深度为常数", "Full self-attention has per-layer complexity O(n²d), constant sequential operations and constant maximum path length. Recurrence has O(nd²) work and O(n) sequential steps and paths.": "完整自注意力每层复杂度为 O(n²d)，顺序操作和最长路径均为常数；递归计算量为 O(nd²)，顺序步骤和路径为 O(n)。", "Cost comparison depends on n and d": "计算量比较取决于长度与宽度", "The stated self-attention-versus-recurrence cost advantage applies when sequence length n is smaller than representation width d. Restricted neighborhoods of size r trade O(rnd) work for O(n/r) paths.": "文中自注意力相对递归的计算量优势以序列长度 n 小于表示宽度 d 为条件；限制为大小 r 的邻域，可用 O(rnd) 计算量换取 O(n/r) 路径长度。", "Convolution needs longer paths": "卷积需要更长的信息路径", "Connecting distant positions with contiguous convolutions requires O(n/k) layers; dilated convolutions require O(log_k n), compared with direct full attention connections.": "连续卷积连接远处位置需要 O(n/k) 层，扩张卷积需要 O(log_k n) 层，而完整注意力可以直接连接。", "Data, batching and optimization": "数据、分批与优化", "Train translation models on length-grouped batches with a warmup learning-rate schedule.": "按长度组织翻译批次，使用带预热的学习率计划。", "4.5 million and 36 million pairs": "四百五十万与三千六百万句对", "Use WMT 2014 English-German with about 4.5 million pairs and a shared vocabulary near 37000; English-French uses 36 million sentences and a 32000-piece vocabulary.": "英德使用 WMT 2014 约 450 万句对及约 37000 的共享词表；英法使用 3600 万句子及 32000 的词片词表。", "Group similar lengths into batches": "按相近长度组织批次", "Each batch contains approximately 25000 source and 25000 target tokens, with sentence pairs grouped by approximate sequence length.": "按近似序列长度分组句对，每批约含来源 25000 个词元及目标 25000 个词元。", "Warm up for 4000 steps": "预热四千步", "Use Adam with β₁=0.9, β₂=0.98 and ε=10⁻⁹. Learning rate equals d_model^−0.5 times min(step^−0.5, step·4000^−1.5), increasing linearly before inverse-square-root decay.": "Adam 参数为 β₁=0.9、β₂=0.98、ε=10⁻⁹。学习率为 d_model^−0.5 乘 min(step^−0.5, step·4000^−1.5)，先线性增加，再按步数平方根的倒数下降。", "Eight P100s; 12 hours or 3.5 days": "八张 P100；十二小时或三天半", "Train the base model for 100000 steps, about 12 hours, at 0.4 seconds per step. Train the big model for 300000 steps, about 3.5 days, at 1.0 second per step, on eight P100 graphics processors.": "使用八张 P100；基础模型训练 100000 步，每步约 0.4 秒，共约十二小时；大模型训练 300000 步，每步约 1.0 秒，共约三天半。", "Regularize and decode": "正则化与解码", "Apply dropout and target smoothing during training, then average checkpoints and run beam search.": "训练时使用丢弃和目标平滑，推理时平均检查点并执行束搜索。", "Drop sublayer and embedding outputs": "丢弃子层与嵌入输出", "Apply dropout before residual addition and normalization, and to embedding-plus-position vectors. Base-model dropout is 0.1.": "在残差相加与归一化前施加子层丢弃，也对嵌入与位置之和施加丢弃；基础模型丢弃率为 0.1。", "Smooth target labels by 0.1": "以 0.1 平滑目标标签", "Label smoothing with value 0.1 worsens perplexity in the reported comparison while improving prediction accuracy and translation score.": "采用 0.1 的标签平滑；文中报告其困惑度表现变差，但预测准确率和翻译分数提高。", "Average checkpoints; beam width 4": "平均检查点，束宽为四", "Average the last five base checkpoints or twenty big-model checkpoints. Translation uses beam width four, length penalty 0.6 and a maximum output length of input length plus fifty.": "平均基础模型最后五个或大模型最后二十个检查点；翻译束宽为四，长度惩罚为 0.6，最大输出长度为输入长度加五十。", "Translation quality and cost": "翻译质量与训练成本", "Compare translation scores and estimated training work with prior architectures.": "与已有结构比较翻译分数和估计训练计算量。", "English–German reaches 28.4": "英德翻译达到 28.4", "Table 2 reports 28.4 for the big Transformer and 27.3 for the base model; the listed convolutional ensemble reaches 26.36. The paper reports an improvement above two points over previous best results.": "表二报告大模型 28.4、基础模型 27.3；其中卷积集成模型为 26.36。论文报告相对已有最佳结果提升超过两分。", "English–French: 41.8 in Table 2": "表二英法分数为 41.8", "The abstract and Table 2 report 41.8 for the big Transformer, while the Section 6.1 paragraph states 41.0. Table 2 lists 41.29 for the convolutional ensemble and 38.1 for the base Transformer.": "摘要和表二将大模型英法分数记为 41.8，第 6.1 节段落记为 41.0；表二还列出卷积集成 41.29、基础 Transformer 38.1。", "Report training operation estimates": "报告训练运算量估计", "Table 2 lists 3.3×10¹⁸ floating-point operations for the base Transformer and 2.3×10¹⁹ for the big model. Costs are estimated from training time, processor count and sustained single-precision throughput.": "表二列出基础模型约 3.3×10¹⁸ 次、大模型约 2.3×10¹⁹ 次浮点运算；估计依据训练时间、处理器数量及持续单精度吞吐率。", "Test architectural choices": "检验结构选择", "Change individual components on the English-German development set without checkpoint averaging.": "在英德开发集上分别改变组件，并保持不平均检查点。", "One head loses 0.9 points": "单头分数降低 0.9", "At comparable computation, the single-head development score is 24.9 versus 25.8 for the base model; too many heads also reduce quality. Smaller key widths hurt performance.": "相近计算量下，单头开发集分数为 24.9，基础模型为 25.8；头数过多同样降低质量，更小的键宽度也影响表现。", "Capacity and dropout matter": "容量与丢弃都有作用", "The experiments vary depth, model width, feed-forward width, dropout and label smoothing. The big setting uses width 1024, feed-forward width 4096 and sixteen heads.": "实验改变深度、模型宽度、前馈宽度、丢弃及标签平滑；大模型使用宽度 1024、前馈宽度 4096 和十六个头。", "Learned positions are comparable": "可学习位置编码效果接近", "Replacing sinusoids with learned position embeddings yields a development score of 25.7 versus 25.8 for the base sinusoidal setting.": "将正弦位置编码替换为可学习嵌入，开发集分数为 25.7，基础正弦设置为 25.8。", "Transfer to constituency parsing": "迁移到成分句法分析", "Evaluate the sequence model on structured outputs with both limited and additional training data.": "用有限数据和额外训练数据，在结构化输出任务上评估序列模型。", "Train a four-layer parser": "训练四层句法分析模型", "Use four layers and width 1024. Train on roughly 40000 Penn Treebank sentences, or add high-confidence parsed data for a roughly seventeen-million-sentence setting.": "使用四层、宽度 1024；在约四万条 Penn Treebank 句子上训练，或加入高置信解析数据，形成约一千七百万句子的设置。", "Allow longer structured outputs": "允许更长的结构化输出", "Parsing inference uses maximum output length input plus 300, beam width 21 and length penalty 0.3.": "句法分析推理的最大输出长度为输入加 300，束宽 21，长度惩罚 0.3。", "Parsing scores: 91.3 and 92.7": "句法分析分数为 91.3 与 92.7", "On Wall Street Journal Section 23, the Transformer achieves F1 91.3 using the standard training set and 92.7 with semi-supervised data. The table also lists stronger multi-task and generative comparisons at 93.0 and 93.3.": "在华尔街日报第 23 部分，标准训练集上的 F1 为 91.3，加入半监督数据后为 92.7；表中多任务和生成式对照分别为更高的 93.0 和 93.3。", "Contributions and research directions": "研究贡献与后续方向", "Connect the attention-based design to translation performance and broader sequence tasks.": "把基于注意力的设计连接到翻译效果及更广泛的序列任务。", "Contribution 1: attention architecture": "贡献一：基于注意力的结构", "A complete encoder-decoder sequence model builds representations using multi-head attention and positionwise transformations, supporting substantially more parallel training.": "完整编码器—解码器序列模型使用多头注意力与逐位置变换构建表示，支持更高程度的并行训练。", "Contribution 2: translation evidence": "贡献二：翻译实验依据", "Translation comparisons support high quality at reduced training cost, and parsing experiments demonstrate transfer to another structured prediction task.": "翻译对照支持较低训练成本下的高质量结果，句法分析实验展示向另一种结构预测任务迁移的能力。", "Explore restricted attention and modalities": "探索局部注意力与其他模态", "The conclusion proposes restricted attention for larger inputs, applications beyond text and generation with fewer sequential steps as further research directions.": "结论提出后续研究方向：面向更大输入的局部注意力、文本之外的模态，以及减少生成过程中的顺序步骤。", "Motivate parallel representations": "引出并行表示", "Supply architectural context": "提供结构背景", "Define the source stack": "定义来源堆叠", "Supply source representations": "提供来源表示", "Require compatible widths": "要求匹配宽度", "Supply attention inputs": "提供注意力输入", "Set score scaling": "确定分数缩放", "Define each projected head": "定义各投影头", "Choose head dimensions": "确定各头维度", "Supply parallel outputs": "提供并行输出", "Provide attention mechanism": "提供注意力机制", "Supply encoder memory": "提供编码器表示", "Preserve autoregressive inputs": "保持自回归输入条件", "Supply source-conditioned output": "提供以来源为条件的输出", "Supply token embeddings": "提供词元嵌入", "Represent position structure": "表示位置结构", "Supply ordered source vectors": "提供包含顺序的来源向量", "Apply transformation per position": "逐位置执行变换", "Supply feed-forward update": "提供前馈更新", "Motivate complexity comparison": "引出复杂度比较", "State cost conditions": "说明计     if(to\u0026\u0026targets[to])return targets[to];if(from\u0026\u0026sources[from])return sources[from];\n    const originals=edges.flatMap(e=\u003eraw(e.refs)),rawTo=same(originals.map(r=\u003er.to)),rawFrom=same(originals.map(r=\u003er.from));\n    if(rawTo\u0026\u0026targets[rawTo])return targets[rawTo];if(rawFrom\u0026\u0026sources[rawFrom])return sources[rawFrom];\n    return unique(edges.map(connectionText)).join('；');\n  }\n  const groups=new Map();\n  for(const segment of segments){const key=JSON.stringify(segment.keys);if(!groups.has(key))groups.set(key,{keys:segment.keys,candidates:[]});groups.get(key).candidates.push(segment);}\n  const captions=[],covered=new Set(),groupByTarget=new Map();\n  const length=s=\u003eMath.abs(s.a.x-s.b.x)+Math.abs(s.a.y-s.b.y);\n  // One common-action caption per convergence, on the segment with the fullest actual membership.\n  for(const group of groups.values())if(group.keys.length\u003e1){\n    const target=same(group.keys.map(key=\u003eedgeBy.get(key).to));if(!target)continue;\n    const previous=groupByTarget.get(target);\n    if(!previous||group.keys.length\u003eprevious.keys.length||group.keys.length===previous.keys.length\u0026\u0026Math.max(...group.candidates.map(length))\u003eMath.max(...previous.candidates.map(length)))groupByTarget.set(target,group);\n  }\n  for(const[target,group]of groupByTarget){\n    const commonText=summarize(group.keys);\n    const branchTexts=unique(group.keys.map(key=\u003econnectionText(edgeBy.get(key))));\n    // A joined list repeats the branch labels; retain those labels on the branches.\n    if(branchTexts.length\u003e1\u0026\u0026commonText===branchTexts.join('；'))continue;\n    // A tiny inlet cannot carry a bundle description. Keep its actual branch\n    // descriptions instead; the shared wire still retains all clickable members.\n    const spans=new Map();for(const s of group.candidates){const h=s.a.y===s.b.y,key=(h?'h:':'v:')+(h?s.a.y:s.a.x);if(!spans.has(key))spans.set(key,     window.B=null;
    document.querySelector('#graphBreadcrumbs').parentElement.append(next);
    document.querySelector('#graphBreadcrumbs').replaceChildren();
    document.querySelector('#graphPicker').replaceChildren();
    next.querySelectorAll('button').forEach(node=>node.remove());
    document.querySelectorAll('.path-menu').forEach(node=>node.remove());
    document.querySelector('#canvas').replaceChildren();
    document.querySelectorAll('.toolbar button,.toolbar input,.toolbar select').forEach(control=>control.disabled=false);
  try{
    const catalog=await runtime.catalog(),picker=document.querySelector('#graphPicker');
    if(ticket!==generation)return;
    const requested=runtime.requested();
    const current=catalog.graphs.find(g=>g.source===requested||g.id===requested)||(!requested?catalog.graphs[0]:null);
    const id=current?.id||requested;
    if(!id){status.textContent=t('尚无代码图，请先通过 Skill 保存 JSON。');return;}
    if(!runtime.standalone&&current&&location.pathname!==current.url)try{history.replaceState(null,'',current.url+location.search+location.hash);}catch{}
    const source=current?.source||requested;
    const directory=current?.kind==='folder'?source:source.slice(0,source.lastIndexOf('/'));
    // Path segments show only the selected source path. Descending is a separate action.
    picker.append(new Option('',''));
    const local=catalog.graphs.filter(g=>g.source!==source&&g.source.slice(0,g.source.lastIndexOf('/'))===directory);
    for(const item of local.sort(byTypeAndName)){
      const option=new Option(item.source.split('/').at(-1)+(item.kind==='folder'?'/':''),runtime.url(item.source));option.dataset.kind=item.kind;picker.append(option);
    }
    picker.value='';picker.onchange=()=>{if(picker.value)runtime.follow(picker.value);};
    const path=document.querySelector('#graphBreadcrumbs'),parts=source.split('/');
    for(let i=0;i<parts.length;i++){
      if(i){const divider=document.createElement('span');divider.className='path-divider';divider.textContent='/';path.append(divider);}
      const targetSource=parts.slice(0,i+1).join('/'),parentSource=parts.slice(0,i).join('/');
      const siblings=catalog.graphs.filter(g=>g.source===targetSource||g.source.slice(0,g.source.lastIndexOf('/'))===parentSource);
      const select=document.createElement('select');select.className='path-segment';select.setAttribute('aria-label',t('切换 {path}',{path:targetSource}));
      for(const item of siblings.sort(byTypeAndName)){const option=new Option(item.source.split('/').at(-1)+(item.kind==='folder'?'/':''),runtime.url(item.source));option.dataset.kind=item.kind;select.append(option);}
      select.value=runtime.url(targetSource);
      select.onchange=()=>runtime.follow(select.value,{focus_path:source});
      path.append(select);
      styleSelector(select);
    }

    next.hidden=current?.kind!=='folder'||local.length===0;
    if(!next.hidden){const divider=document.createElement('span');divider.className='path-divider';divider.textContent='/';path.append(divider,next);styleSelector(picker,true);}

    const payload=await runtime.graph(id);
    if(ticket!==generation)return;
    if(!payload.graph){
      document.title=source+' / ExtractStructure';
      status.textContent=t('当前目录尚未生成目录图');
      const message=document.createElement('p');message.className='graph-empty-message';
      message.textContent=t('此目录尚未生成目录图。可通过上方路径返回上级，或选择子目录、Python 文件查看已有图。');
      document.querySelector('#canvas').append(message);
      document.querySelectorAll('.toolbar button,.toolbar input,.toolbar select').forEach(control=>control.disabled=true);
      return;
    }
    const graph=GraphLocale.localize(payload.graph),hints={...graph.display,title:graph.source},layouts={};
    for(const level of ['L1','L2']){
      const plan=hints[level]||{};
      layouts[level]={nodes:Object.fromEntries(graph.graphs[level].nodes.map(n=>[n.id,{role:'operation',column:0,lane:0,...plan.nodes[n.id]}])),
        edges:graph.graphs[level].edges.map((e,index)=>({from:e.from,to:e.to,index,primary:(plan.main_edges||[]).some(pair=>pair[0]===e.from&&pair[1]===e.to)}))};
    }
    window.B={original:payload.graph,data:graph,layouts,presentation:hints.presentation,title:hints.title||graph.source,input_sha256:payload.sha256,restore:GraphLocale.restore(graph.source)};
    document.title=(hints.title||graph.source)+' / ExtractStructure';
    window.ExtractViewerMount();
  }catch(error){if(ticket===generation)status.textContent=t('加载失败：{error}',{error:error.message});}
  }
  window.addEventListener('extract:navigate',renderPage);
  window.addEventListener('hashchange',()=>{if(runtime.standalone)renderPage();});
  window.addEventListener('popstate',()=>{if(runtime.standalone)renderPage();});
  window.addEventListener('extract:language',()=>{
    if(!window.B)return;const snapshot=window.SemanticPreview?.snapshot();
    window.ExtractViewerDispose?.();
    B.data=GraphLocale.localize(B.original);B.presentation=B.data.display.presentation;B.restore=snapshot;
    window.ExtractViewerMount();
  });
  document.addEventListener('click',event=>{const link=event.target.closest('a.node-entry-link');if(runtime.standalone&&link){event.preventDefault();runtime.navigate(decodeURIComponent(new URL(link.getAttribute('href'),'https://extract-structure.invalid').pathname.slice(base.length)));}});
  renderPage();
})();

</script></body></html>
