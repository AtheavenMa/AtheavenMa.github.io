<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><title>SAEBase Workspace — OpenSAE</title><link href="https://fonts.googleapis.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&amp;display=swap" rel="stylesheet"/><link href="studio.css" rel="stylesheet"/><link href="workspace.css" rel="stylesheet"/><link href="workspace-v4.css" rel="stylesheet"/><link href="workspace-live.css?v=wp16-final" rel="stylesheet"/></head><body class="workspace-body"><header class="workspace-header"><a class="workspace-brand" href="index.html">OpenSAE<span class="brand-divider">/</span><strong>SAEBase</strong></a><a class="workspace-docs" href="https://github.com/OpenSAE/SAEBase/tree/main/docs" rel="noopener" target="_blank">Docs ↗</a><a class="workspace-docs" href="api.html">API ↗</a><a class="workspace-back" href="contact.html">Contact</a></header><div class="workspace-layout"><aside aria-label="Research workflows" class="workspace-rail"><nav id="workspace-nav"><button class="active" data-module="explore">Explore</button><button data-module="intervene">Intervene</button><button data-module="generate">Generate</button><button data-module="circuits">Circuits</button><button data-module="benchmarks">Evaluate</button><button data-module="training">Train</button><button data-module="interpret">Interpret</button></nav></aside><main class="workspace-main live-app">
  <div class="api-connection"><label for="api-base">API</label><input id="api-base" type="url" spellcheck="false" placeholder="https://your-saebase-api.example" aria-label="SAEBase API address"><button id="api-connect" type="button">Connect</button><strong id="api-status" role="status">Not connected</strong></div>
  <section class="workspace-panel active" data-pane="explore"><div class="worktop"><h1>Explore</h1></div>
    <form id="explore-search" class="live-form"><label>Feature search <input id="feature-query" placeholder="Feature ID or description" /></label><button type="submit">Search</button></form>
    <div id="feature-results" class="live-result" aria-live="polite"></div>
    <div class="live-actions"><button id="load-traces" type="button">Browse prompts</button><button id="load-sites" type="button">Models</button></div><div id="explore-results" class="live-result"></div><div id="token-inspector" class="live-result"></div>
  </section>
  <section class="workspace-panel" data-pane="intervene"><div class="worktop"><h1>Intervene</h1></div>
    <form id="edit-form" class="live-form"><label>Model site <input id="edit-site" required placeholder="model:sae:L5"></label><label>Feature <input id="edit-feature" type="number" min="0" required></label><label>Operation <select id="edit-operation"><option value="ablate">Ablate</option><option value="scale">Scale</option><option value="clamp">Clamp</option><option value="add">Add</option></select></label><label>Strength <input id="edit-strength" type="number" value="2" step="0.1"></label><label class="wide">Prompt <textarea id="edit-prompt" rows="3" required></textarea></label><div class="live-actions"><button type="button" id="edit-check">Validate</button><button type="submit">Run edit</button></div></form>
    <div class="auth-row"><label>Operator token <input id="operator-token" type="password" autocomplete="off" placeholder="Only for private GPU execution"></label></div><div class="live-actions"><button id="edit-refresh" type="button" hidden>Refresh job</button></div><div id="edit-results" class="live-result"></div>
  </section>
  <section class="workspace-panel" data-pane="generate"><div class="worktop"><h1>Generate</h1></div><div class="live-actions"><button id="load-generation" type="button">Load results</button><a href="api.html#generate">Run with Python ↗</a></div><div id="generation-results" class="live-result"></div></section>
  <section class="workspace-panel" data-pane="circuits"><div class="worktop"><h1>Circuits</h1></div><div class="live-actions"><button id="load-circuit" type="button">Load circuit</button><label>Edge strength <input id="edge-threshold" type="range" min="0" max="40" value="0"></label></div><div id="circuit-results" class="live-result"></div><svg id="live-circuit" viewBox="0 0 900 520" role="img" aria-label="Feature attribution graph"></svg><div id="circuit-selection" class="live-result"></div></section>
  <section class="workspace-panel" data-pane="benchmarks"><div class="worktop"><h1>Evaluate</h1></div><div class="live-actions"><button id="load-benchmark" type="button">Load benchmarks</button><a href="api.html#evaluate">Evaluation API ↗</a></div><div id="benchmark-results" class="live-result"></div></section>
  <section class="workspace-panel" data-pane="training"><div class="worktop"><h1>Train</h1></div><div class="live-actions"><button id="load-training" type="button">Load training</button><a href="api.html#train">Training commands ↗</a></div><div id="training-results" class="live-result"></div></section>
  <section class="workspace-panel" data-pane="interpret"><div class="worktop"><h1>Interpret</h1></div><div class="live-actions"><button id="load-interpret" type="button">Load interpretation</button><a href="api.html#interpret">Interpretation API ↗</a></div><div id="interpret-results" class="live-result"></div></section>
</main></div><script defer="" src="studio.js"></script><script defer="" src="workspace.js"></script><script defer src="workspace-live.js?v=wp16-final"></script></body></html>
